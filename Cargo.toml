[package]
name = "azangara-launcher"
version = "0.1.0"
edition = "2021"
description = "Toolkit to configure and launch every Azangara build (Direct3D 1.x and OpenGL)"

[lib]
name = "azangara"
path = "src/lib.rs"

[[bin]]
name = "azl"
path = "src/main.rs"

[[bin]]
name = "azangara-launcher"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:zip", "dep:eframe", "dep:egui_extras", "dep:image", "dep:open", "dep:serde", "dep:serde_json", "dep:ureq"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37.0", optional = true }
egui_extras = { version = "0.37.0", features = ["all_loaders"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
open = { version = "5.4.4", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
ureq = { version = "3.4.2", features = ["json"], optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate"], optional = true }
